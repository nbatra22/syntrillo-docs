# VSCODE : CLEAR CACHE AND RELOAD IF CHANGES MADE HERE

# -----------------------------------------------------------------------------
# VSCode python path
#   : Paths are relative to the workspace folder
PYTHONPATH=./sources/

# -----------------------------------------------------------------------------
# Local tweaks

# between each tab in index.html (default hardcoded to 1000) - needed when debugging with local VSCode server
# MILLISECONDS_DELAY=3000

