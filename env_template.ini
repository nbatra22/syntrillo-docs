# -----------------------------------------------------------------------------
# HEALTHIE API
#  - organization : 'staging' or 'production'

HEALTHIE_ORGANIZATION='xxx'
HEALTHIE_API_KEY='xxxxxxxxxxxxxxxxxxxx'

# -----------------------------------------------------------------------------
# TENOVI API
# - client domain: used in the URL to access the API : https://api2.tenovi.com/clients/{client_domain}
#    - syntrillo      : mix of RPM and HWI modules. HWI not fully implemented
#    - syntrillo-hwi  : HWI module only
# - the base URL is hard coded, with the version of the API
TENOVI_CLIENT_DOMAIN='xxx'
TENOVI_API_KEY='xxxxxxxxxxxxxxxxxxxxxxxx'

# -----------------------------------------------------------------------------
# What database to use
# : 'PythonAnywhere', 'AWS'
DATABASE_SERVER='PythonAnywhere'

# AWS DATABASE CREDENTIALS
AWS_DATABASE_CONFIG_HOST="xxxxxxxxx.rds.amazonaws.com"
AWS_DATABASE_CONFIG_USER="xxxxxxxx"
AWS_DATABASE_CONFIG_PASSWORD="xxxxxxxxxxx"
AWS_DATABASE_CONFIG_LOCAL_PORT=3306

# mySQL database at PythonAnywhere
PYTHON_ANYWHERE_DATABASE_CONFIG_USER='syntrillo'
PYTHON_ANYWHERE_DATABASE_CONFIG_PASSWORD='xxxxxxxxxxxxxxxxx'
PYTHON_ANYWHERE_DATABASE_CONFIG_HOST='syntrillo.mysql.pythonanywhere-services.com'

# ssh tunneling required if outside of PythonAnywhere
PYTHON_ANYWHERE_DATABASE_CONFIG_SSH_USERNAME='syntrillo'
PYTHON_ANYWHERE_DATABASE_CONFIG_SSH_PASSWORD='xxxxxxxxxxxxx'

# -----------------------------------------------------------------------------
# Set your OpenAI API key
OPENAI_API_KEY = 'xxxxxxxxxxxxxxxxxxxxxxx'


