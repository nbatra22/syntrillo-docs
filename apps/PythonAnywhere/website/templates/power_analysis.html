<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>Power Analysis</title>

    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #f8f8f8;
        }

        h1 {
            color: #333;
        }

        h2 {
            color: #333;
        }

        table {
            /* width: 50%; */
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 2px;
            text-align: left;
            /* border-bottom: 1px solid #ddd; */
        }

        th {
            background-color: #f2f2f2;
        }

        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            max-width: 600px;
            /* margin-left: auto; */
            /* margin-right: 10px; */

        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
        }

        input {
            /* width: 100%; */
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            background-color: #007bff;
            color: #fff;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Power Analysis</h1>

    <h2>Fisher test</h1>

    <form id="powerForm">
        <table>
            <tr>
                <th>Parameter</th>
                <th>Value</th>
            </tr>
            <tr>
                <td><label for="p1">Proportion in Arm 1 (p1):</label></td>
                <td><input type="number" step="0.01" min="0" max="1" id="p1" name="p1" value="0.40" required></td>
            </tr>
            <tr>
                <td><label for="p2">Proportion in Arm 2 (p2):</label></td>
                <td><input type="number" step="0.01" min="0" max="1" id="p2" name="p2" value="0.50" required></td>
            </tr>
            <tr>
                <td><label for="desiredPower">Desired Power:</label></td>
                <td><input type="number" step="0.05" min="0" max="1" id="desiredPower" name="desiredPower" value="0.80" required></td>
            </tr>
            <tr>
                <td><label for="alpha">Significance Level (alpha):</label></td>
                <td><input type="number" step="0.01" min="0" max="1" id="alpha" name="alpha" value="0.05" required></td>
            </tr>
            <tr>
                <td><label for="ratio">Arm 2/Arm 1 Size Ratio:</label></td>
                <td><input type="number" step="1" min="0" id="ratio" name="ratio" value="1" required></td>
            </tr>
            <tr>
                <td><label for="n2Forced">If specified, makes the size of Arm 2 static (n2Forced):</label></td>
                <td><input type="number" step="1" min="0" id="n2Forced" name="n2Forced" value="0" required></td>
            </tr>
            <tr>
                <td></td>
                <td><button type="button" onclick="runPowerAnalysis()">Run Power Analysis</button></td>
            </tr>
        </table>
    </form>

    <div id="results"></div>

    <script>
        function runPowerAnalysis() {
            // Get form data
            const formData = {
                p1: parseFloat(document.getElementById('p1').value),
                p2: parseFloat(document.getElementById('p2').value),
                desired_power: parseFloat(document.getElementById('desiredPower').value),
                alpha: parseFloat(document.getElementById('alpha').value),
                ratio: parseFloat(document.getElementById('ratio').value),
                n1_start: parseInt(20),
                n2_forced: parseFloat(document.getElementById('n2Forced').value),
            };

            // Make an HTTP POST request to the server
            fetch('/power-fisher', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData),
            })
            .then(response => response.json())
            .then(data => {
                // Display results
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = `
                    <h2>Power Analysis Results</h2>
                    <p>Study Size: ${data.n}</p>
                    <p>Arm 1 Size: ${data.n1}</p>
                    <p>Arm 2 Size: ${data.n2}</p>
                    <p>Proportion in Arm 1 (p1): ${data.p1}</p>
                    <p>Proportion in Arm 2 (p2): ${data.p2}</p>
                    <p>Significance Level (alpha): ${data.alpha}</p>
                    <p>Achieved Power: ${data.achieved_power}</p>
                    <p>Number of Iterations: ${data.iterations}</p>
                `;
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
