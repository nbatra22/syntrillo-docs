<div id="login-form">

    <button onclick="showLogin()">Back to Login</button>
    <div id="forgot-message"></div>
</div>

<div id="reset-password-form" style="display:none;">
    <h2>Reset Password</h2>
    <input type="text" id="reset-code" placeholder="Verification Code" required>

    <button onclick="resetPassword()">Reset Password</button>
    <button onclick="showLogin()">Back to Login</button>

<script>
const API_URL = '';
let authToken = localStorage.getItem('authToken');

// Check if user is already logged in
if (authToken) {
    showIframeProviderSideBar();
}

async function login() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    
    try {
        const response = await fetch(`${API_URL}/auth/login`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            authToken = data.token;
            localStorage.setItem('authToken', authToken);
            document.getElementById('login-message').innerHTML = '<p style="color:green;">Login successful!</p>';
            showIframeProviderSideBar();
        } else {
            document.getElementById('login-message').innerHTML = `<p style="color:red;">${data.error}</p>`;
        }
    } catch (error) {
        document.getElementById('login-message').innerHTML = '<p style="color:red;">Login failed</p>';
    }
}

async function showIframeProviderSideBar() {
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('provider-sidebar').style.display = 'block';
    load_all_tabs()
}

function logout() {
    localStorage.removeItem('authToken');
    authToken = null;
    document.getElementById('login-form').style.display = 'block';
    document.getElementById('provider-sidebar').style.display = 'none';
    document.getElementById('login-message').innerHTML = '';
}

function showLogin() {
    document.getElementById('login-form').style.display = 'block';
    document.getElementById('forgot-password-form').style.display = 'none';
    document.getElementById('reset-password-form').style.display = 'none';
    document.getElementById('protected-content').style.display = 'none';
}

function showForgotPassword() {
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('forgot-password-form').style.display = 'block';
    document.getElementById('reset-password-form').style.display = 'none';
}

async function forgotPassword() {
    const email = document.getElementById('forgot-email').value;
    
    try {
        const response = await fetch(`${API_URL}/auth/forgot-password`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username: email })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            document.getElementById('forgot-message').innerHTML = '<p style="color:green;">Reset code sent to your email!</p>';
            setTimeout(() => {
                document.getElementById('forgot-password-form').style.display = 'none';
                document.getElementById('reset-password-form').style.display = 'block';
            }, 2000);
        } else {
            document.getElementById('forgot-message').innerHTML = `<p style="color:red;">${data.error}</p>`;
        }
    } catch (error) {
        document.getElementById('forgot-message').innerHTML = '<p style="color:red;">Failed to send reset code</p>';
    }
}

async function resetPassword() {
    const email = document.getElementById('forgot-email').value;
    const code = document.getElementById('reset-code').value;
    const newPassword = document.getElementById('new-password').value;
    
    try {
        const response = await fetch(`${API_URL}/auth/reset-password`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ 
                username: email,
                code: code,
                new_password: newPassword
            })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            document.getElementById('reset-message').innerHTML = '<p style="color:green;">Password reset successful! Please login.</p>';
            setTimeout(() => {
                showLogin();
                document.getElementById('reset-message').innerHTML = '';
                document.getElementById('forgot-message').innerHTML = '';
            }, 2000);
        } else {
            document.getElementById('reset-message').innerHTML = `<p style="color:red;">${data.error}</p>`;
        }
    } catch (error) {
        document.getElementById('reset-message').innerHTML = '<p style="color:red;">Failed to reset password</p>';
    }
}

</script>

<script>

    // Global function to format ISO date to US date format (MMM DD, YYYY)
    function formatDate(isoDate) {
        var date = new Date(isoDate);
        var options = { year: 'numeric', month: 'short', day: 'numeric' };
        return date.toLocaleDateString('en-US', options);
    }

    // Function to load content via POST
    //   : POST prefered over GET to avoid caching sensitive data in the URL
    function loadTabContent(url, target, milliseconds_delay = {{ milliseconds_delay }}, retryCount = 0, maxRetries = 3) {

        let authToken = localStorage.getItem('authToken');

        $(target).html("<h3>Loading content. Please wait...</h3>");

        // Variables passed from Flask
        var healthieProviderId = "{{ healthie_provider_id }}";

        // The global setTimeout() method sets a timer which executes a function or specified piece of code once the timer expires.
        setTimeout(function() {
            $.ajax({
                type: 'POST',
                url: url,
                headers: {
                    'Authorization': 'Bearer ' + authToken
                },
                data: {
                    healthie_provider_id: healthieProviderId,
                },
                success: function(data) {
                    $(target).html(data);
                },
                error: function(jqXHR, textStatus, errorThrown) {
                    if (jqXHR.status === 504) {
                        if (retryCount < maxRetries) {
                            // Retry after 5 seconds if a 504 error occurs
                            $(target).html('<h3>Received 504 Timeout Error. Retrying...</h3>');
                            setTimeout(function () {
                                loadTabContent(url, target, milliseconds_delay, retryCount + 1, maxRetries);
                            }, 5000); // 5 seconds delay before retry
                        } else {
                            $(target).html('<h3>Error: 504 Gateway Timeout. Please try again later.</h3>');
                        }
                    } else {
                        $(target).html('<h3>Error: ' + jqXHR.status + ' ' + errorThrown + '</h3>');
                    }
                }
            });
        }, milliseconds_delay); // some delay needed to prevent a server error on VSCode Live Server
    }

    function load_all_tabs() {
        // Delegate the click event to the parent container for collapsible sections
        $(document).on('click', '.collapsible', function() {
            var icon = $(this).find("i");
            icon.toggleClass("fa-chevron-right fa-chevron-down");
            $(this).next(".collapsible-content").toggleClass("show");
        });

        // Load the content of the status tab immediately
        loadTabContent('{{ url_for("iframe_healthie_provider_sidebar_billing_bp.iframe_healthie_provider_sidebar_billing") }}', '#tab-billing', 10);
        loadTabContent('{{ url_for("iframe_healthie_provider_sidebar_status_bp.iframe_healthie_provider_sidebar_status") }}', '#tab-status');

        // Load the content of the other tabs in the background
        {% if is_local %}
        loadTabContent('{{ url_for("iframe_healthie_provider_sidebar_questionnaire_bp.iframe_healthie_provider_sidebar_questionnaire") }}', '#tab-questionnaire');
        {% endif %}

        loadTabContent('{{ url_for("iframe_healthie_provider_sidebar_questionnaire_database_bp.iframe_healthie_provider_sidebar_questionnaire_database") }}', '#tab-questionnaire-database');

        loadTabContent('{{ url_for("iframe_healthie_provider_sidebar_dumps_bp.iframe_healthie_provider_sidebar_dumps") }}', '#tab-dumps');

        loadTabContent('{{ url_for("iframe_healthie_provider_sidebar_system_bp.iframe_healthie_provider_sidebar_system") }}', '#tab-system');
    }

    $(document).ready(function(){

        // Delegate the click event to the parent container for collapsible sections
        $(document).on('click', '.collapsible', function() {
            var icon = $(this).find("i");
            icon.toggleClass("fa-chevron-right fa-chevron-down");
            $(this).next(".collapsible-content").toggleClass("show");
        });

        // Load the content of the status tab immediately
        loadTabContent('{{ url_for("iframe_healthie_provider_sidebar_billing_bp.iframe_healthie_provider_sidebar_billing") }}', '#tab-billing', 10);
        loadTabContent('{{ url_for("iframe_healthie_provider_sidebar_status_bp.iframe_healthie_provider_sidebar_status") }}', '#tab-status');

        // Load the content of the other tabs in the background
        {% if is_local %}
        loadTabContent('{{ url_for("iframe_healthie_provider_sidebar_questionnaire_bp.iframe_healthie_provider_sidebar_questionnaire") }}', '#tab-questionnaire');
        {% endif %}

        loadTabContent('{{ url_for("iframe_healthie_provider_sidebar_questionnaire_database_bp.iframe_healthie_provider_sidebar_questionnaire_database") }}', '#tab-questionnaire-database');

        loadTabContent('{{ url_for("iframe_healthie_provider_sidebar_dumps_bp.iframe_healthie_provider_sidebar_dumps") }}', '#tab-dumps');

        loadTabContent('{{ url_for("iframe_healthie_provider_sidebar_system_bp.iframe_healthie_provider_sidebar_system") }}', '#tab-system');
    });
</script>
