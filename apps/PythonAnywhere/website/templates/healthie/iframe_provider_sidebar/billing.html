<!-- Styling -->
<style>
    h1,
    h2,
    h3 {
        margin: 0;
    }

    .b-search-bar {
        background-color: #e5e7eb;
        border-radius: 4px;
        padding: 0.75rem;
        outline: none;
        border: none;
        font-size: small;
    }

    .b-main-container {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .b-main-container h1 {
        font-weight: bold;
        font-size: larger;
    }

    .b-main-container p {
        color: #6b7280;
        font-size: small;
        margin: 0;
    }

    .b-header-container {
        padding-top: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .b-header-subcontainer {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
    }

    .b-table-row {
        display: grid;
        grid-template-columns: 1fr 3fr 1fr 1fr;
        gap: 1rem;
        padding: 1rem 0;
        align-items: center;
        border-radius: 0.375rem;
        text-align: center;
    }

    .b-table-row .b-table-name {
        text-align: left;
    }

    #b-table-header {
        border-bottom: 2px solid black;
        border-radius: 0;
    }

    #b-table-header h3 {
        font-weight: bold;
        font-size: 1rem;
    }

    .b-table-container {
        margin-top: 1rem;
    }

    .b-table-content .b-table-row:hover {
        cursor: pointer;
        background-color: #e5e7eb;
    }

    .b-table-content {
        padding: 0.5rem 0;
        display: flex;
        flex-direction: column;
        /* justify-content: center; */
        /* align-items: center; */
        gap: 0.5rem;
    }

    .fa-check {
        color: green
    }

    .fa-x {
        color: red;
    }

    .patient-row .fa-xmark {
        color: red;
    }

    .b-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }

    .b-modal-container {
        background-color: white;
        border-radius: 8px;
        min-width: 60%;
        max-width: 90%;
        min-height: fit-content;
        max-height: 90%;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        text-align: center;
        display: flex;
        flex-direction: column;
    }

    .b-modal-header {
        padding: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid lightgray;
        gap: 2rem;
    }

    .b-modal-title-container {
        display: flex;
        flex-direction: column;
        justify-content: start;
        align-items: start;
    }

    .b-modal-content {
        padding: 2rem;
        min-height: 6rem;
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 2rem;
    }

    .hidden {
        display: none;
    }

    .b-modal-header button {
        padding: 0.375rem 0.75rem;
        border: none;
        border-radius: 9999px;
        cursor: pointer;
        background-color: white;
    }

    .b-modal-header button:hover {
        color: red;
        background-color: #e5e7eb;
    }

    .b-modal-main-container {
        display: flex;
        justify-content: center;
        align-items: start;
        gap: 2rem;
        height: 100%;
        min-height: 8rem;
        width: 100%;
    }

    .b-modal-info-container {
        width: 100%;
    }

    #b-modal-last-billing-date-container {
        display: flex;
        flex-direction: column;
        justify-content: start;
        align-items: start;
    }

    #b-modal-calendar-container {
        min-width: 50%;
    }

    .loading-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        padding: 1rem;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }

    .spinner {
        display: inline-block;
        width: 2rem !important;
        /* Adjust size as needed */
        height: 2rem !important;
        border: 4px solid white;
        /* Light blue */
        border-top-color: #3b82f6;
        /* Solid blue for animation */
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
</style>

<!-- Main Content -->
<div class="b-main-container">
    <div class="b-header-container">
        <div class="b-header-subcontainer">
            <h1 class="b-header">Billing Dashboard</h1>
            <p class="b-subheader">Select a patient to view their measurement history and billing information.</p>
        </div>
        <input type="text" id="b-search-bar" class="b-search-bar" placeholder="Search by name..." />
    </div>

    <div class="b-table-container">
        <div id="b-table-header" class="b-table-row">
            <h3 class="b-table-id">ID</h3>
            <h3 class="b-table-name">Name</h3>
            <h3 class="b-table-eligibility">Eligibility</h3>
            <h3 class="b-table-device-training">Device Training</h3>
        </div>

        <div id="b-table-content" class="b-table-content">

            <div class="loading-container">
                <div id="spinner-container" class="spinner"></div>
                <p>Fetching data...</p>
            </div>

        </div>
    </div>

    <!-- Modal -->
    <div id="b-modal" class="b-modal-overlay hidden">
        <div class="b-modal-container">
            <div class="b-modal-header">
                <div id="" class="b-modal-title-container">
                    <h2 id="b-modal-title">Modal Title</h2>
                    <p id="b-modal-subtitle">This is a simple centered modal.</p>
                </div>
                <button onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="b-modal-content-container" class="b-modal-content">
                <div id="b-modal-loading-div" class=""></div>
                <div class="b-modal-main-container">
                    <div id="b-modal-calendar-container"></div>
                    <div class="b-modal-info-container">
                        <div id="b-modal-last-billing-date-container"></div>
                        <div id="b-modal-billable-dates-container"></div>
                    </div>
                </div>
                <p><i class="fa-solid fa-circle-info"></i> Non-highlighted (gray) dates indicate no measurement was recorded on those days.</p>
            </div>
        </div>
    </div>

</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/vanilla-calendar@3.0.4/build/vanilla-calendar.min.js"></script>

<script>
    let allPatientData = [];

    function getBillingData() {
        fetch("{{ url_for('iframe_healthie_provider_sidebar_billing_bp.iframe_healthie_provider_billing_get_all_patient_data') }}")
            .then(response => response.json())
            .then(data => {
                allPatientData = data['all_patient_overview_data'];
                renderPatientTable(allPatientData);
            })
            .catch(error => {
                console.error('Error:', error);
            });
    };

    function getPatientData(healthie_user_id) {
        const url = "{{ url_for('iframe_healthie_provider_sidebar_billing_bp.iframe_healthie_provider_billing_get_single_patient_data') }}" + "?healthie_user_id=" + encodeURIComponent(healthie_user_id);
        return fetch(url)
            .then(response => response.json())
            .catch(error => {
                console.error('Error:', error);
                return null;
            });
    };

    function renderCalendar(dates) {
        // Clear the container
        const container = document.getElementById('b-modal-calendar-container');
        container.innerHTML = '<input id="calendar-input" type="text" style="display:none;">';

        // Initialize flatpickr
        flatpickr("#calendar-input", {
            inline: true,
            enable: dates,
            appendTo: container
        });
    };

    function formatStatus(status) {
        if (!status) return '';
        // Replace underscores with spaces, then title case each word
        return status
            .replace(/_/g, ' ')
            .toLowerCase()
            .replace(/\b\w/g, char => char.toUpperCase());
    };

    function openModal(name, healthie_user_id) {
        document.getElementById("b-modal-title").textContent = name;
        document.getElementById("b-modal-subtitle").textContent = healthie_user_id;
        document.getElementById("b-modal").classList.remove("hidden");

        let loadingDiv = document.getElementById("b-modal-loading-div")
        let calendarContainer = document.getElementById("b-modal-calendar-container")
        let lastBillingDateContainer = document.getElementById("b-modal-last-billing-date-container")

        calendarContainer.innerHTML = ""
        lastBillingDateContainer.innerHTML = ""

        showSpinner(loadingDiv)

        getPatientData(healthie_user_id).then(data => {
            console.log(data)
            if (!data) return;

            hideSpinner(loadingDiv)
            loadingDiv.classList.add("hidden")

            renderCalendar(data.patient_bp_data);

            // --- Last billing date rendering ---
            if (Array.isArray(data.patient_billing_data) && data.patient_billing_data.length > 0) {
                // Sort by date_of_service descending
                let sorted = data.patient_billing_data.slice().sort((a, b) => new Date(b.date_of_service) - new Date(a.date_of_service));
                let mostRecent = sorted[0];
                let formattedStatus = formatStatus(mostRecent.status)
                lastBillingDateContainer.innerHTML = `<p>Last billed: <strong>${mostRecent.date_of_service}</strong></p><p>Status: <strong>${formattedStatus}</strong></p>`;
            } else {
                lastBillingDateContainer.innerHTML = `<p>No billing data available.</p>`;
            }
        });
    };

    function closeModal() {
        document.getElementById("b-modal").classList.add("hidden");
    }

    function showSpinner(targetElement) {
        targetElement.innerHTML = "";

        // Check if a spinner already exists inside the target
        let existingSpinner = targetElement.querySelector(".spinner");
        if (!existingSpinner) {
            // Create a new spinner
            let spinner = document.createElement("div");
            spinner.classList.add("spinner");

            // Ensure the target element is a flex container to center the spinner
            targetElement.style.display = "flex";
            targetElement.style.justifyContent = "center";
            targetElement.style.alignItems = "center";

            targetElement.appendChild(spinner);
        }
    }

    function hideSpinner(targetElement) {
        // Find and remove the spinner inside the target element
        let spinner = targetElement.querySelector(".spinner");
        if (spinner) {
            spinner.remove();
        }

        // Reset the targetElement styles in case they were changed
        targetElement.style.display = "";
        targetElement.style.justifyContent = "";
        targetElement.style.alignItems = "";
    }

    function renderPatientTable(patientList) {
        let tableContent = document.getElementById('b-table-content');
        let rowsHtml = patientList
            .sort((a, b) => a.patient_name.localeCompare(b.patient_name))
            .map(patient => {
                return `
                    <div class="b-table-row patient-row" onclick="openModal('${patient.patient_name}', '${patient.healthie_user_id}')">
                        <h3 class="b-table-id">${patient.healthie_user_id}</h3>
                        <h3 class="b-table-name">${patient.patient_name}</h3>
                        <h3 class="b-table-eligibility">
                            ${patient.eligible_to_bill
                                ? '<i class="fa-solid fa-check"></i>'
                                : '<i class="fa-solid fa-xmark"></i>'}
                        </h3>
                        <h3 class="b-table-device-training">
                            ${patient.bp_device_training_status
                                ? '<i class="fa-solid fa-check"></i>'
                                : '<i class="fa-solid fa-xmark"></i>'}
                        </h3>
                    </div>
                `;
            }).join('');
        tableContent.innerHTML = rowsHtml;
    }

    $(document).ready(function () {
        getBillingData();

        const searchBar = document.getElementById('b-search-bar');
        searchBar.addEventListener('input', function () {
            const searchTerm = searchBar.value.toLowerCase();
            const filteredPatients = allPatientData.filter(patient =>
                patient.patient_name.toLowerCase().includes(searchTerm)
            );
            renderPatientTable(filteredPatients);
        });
    });

</script>
