{% extends "healthie/iframe_provider_tab/forms/index_form.html" %}

{% block extra_head %}
<style>

#medication-form-content {
    height: 500px;
    overflow: scroll;
}

.form-group-container-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    width: 100%;
}

.medication-keywords-container {
    display: flex;
    flex-direction: column;
    border: 1px solid #d1d5db;
    border-radius: 0.375rem;
    margin-top: 0.25rem;
}

.medication-keywords-container p {
    margin: 0;
    padding: 0.5rem;
    font-size: 0.875rem;
    color: #16284a;
    border-bottom: 1px solid #d1d5db;
    cursor: pointer;
}

.medication-keywords-container p:hover {
    background-color: #f3f4f6;
}

.medication-keywords-container p:last-child {
    border-bottom: none;
}

.dose-suggestions-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    padding: 1rem;
    border-radius: 0.375rem;
    background-color: #f3f4f6;
}

.dose-suggestions-container h3 {
    margin: 0;
    font-weight: 600;
    color: #16284a;
    font-size: small;
}

.dose-suggestions-container ul {
    margin: 0;
    padding: 0;
    font-size: small;
}

.dose-suggestions-container li {
    margin-left: 1rem;
    padding: 0;
    font-size: small;
    list-style-type: disc;
    list-style-position: inside;
}

</style>
{% endblock %}


{% block content %}
<form id="medication-form" class="form-subcontainer" onsubmit="">
    <div id="medication-form-content" class="form-content">
        <input type="hidden" id="medication-id" name="medication_id">
        <input type="hidden" id="medication-dosage-option-id" name="dosage_option_id">
        <input type="hidden" id="medication-mirrored" name="mirrored">

        <div id="medication-name-container" class="form-group">
            <label for="medication-name">Medication Name <span class="required-field">*</span></label>
            <input
                type="text"
                id="medication-name"
                name="medication_name"
                list="medication-suggestions"
                required
                autocomplete="off"
                placeholder="Start typing medication name..."
            >
            <datalist id="medication-suggestions">
                <!-- Options populated dynamically -->
            </datalist>
        </div>

        <div class="form-group-container-2">
            <div id="medication-category-container" class="form-group">
                <label for="medication-category">Category</label>
                <select id="medication-category" name="category">
                    <option value="">-- Select Category --</option>
                    <option value="antiplatelet">Antiplatelet</option>
                    <option value="antihypertensive">Antihypertensive</option>
                    <option value="statin">Statin</option>
                    <option value="hypoglycemic-agent">Hypoglycemic Agent</option>
                    <option value="ace_inhibitor">ACE Inhibitor</option>
                    <option value="arb">ARB</option>
                    <option value="beta_blocker">Beta Blocker</option>
                    <option value="calcium_channel_blocker">Calcium Channel Blocker (CCB)</option>
                    <option value="diuretic">Diuretic</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div id="medication-supercategory-container" class="form-group">
                <label for="medication-supercategory">Supercategory</label>
                <select id="medication-supercategory" name="supercategory">
                    <option value="">-- Select Supercategory --</option>
                    <option value="blood_thinner">Blood Thinner</option>
                    <option value="cholesterol_medication">Cholesterol Medication</option>
                    <option value="diabetes_medication">Diabetes Medication</option>
                    <option value="blood_pressure_medication">Blood Pressure Medication</option>
                    <option value="other">Other</option>
                </select>
            </div>
        </div>

        <div id="medication-is-active-container" class="form-group">
            <label for="medication-is-active">Is this medication currently being taken by the patient? <span class="required-field">*</span></label>
            <div class="input-button-group">
                <div class="input-button-group-item">
                    <input type="radio" id="medication-is-active-yes" name="is_active" value="yes" default>
                    <label for="medication-is-active-yes">Yes</label>
                </div>
                <div class="input-button-group-item">
                    <input type="radio" id="medication-is-active-no" name="is_active" value="no">
                    <label for="medication-is-active-no">No</label>
                </div>
            </div>
        </div>

        <div class="form-group-container-2">
            <div id="medication-start-date-container" class="form-group">
                <label for="medication-start-date">Start Date</label>
                <input type="date" id="medication-start-date" name="start_date">
            </div>
            <div id="medication-end-date-container" class="form-group">
                <label for="medication-end-date">End Date</label>
                <input type="date" id="medication-end-date" name="end_date">
            </div>
        </div>

        <div id="medication-delivery-method-container" class="form-group">
            <label for="medication-delivery-method">Delivery Method</label>
            <select id="medication-delivery-method" name="delivery_method">
                <option value="">-- Select Delivery Method --</option>
                <option value="pill/tablet/capsule">Pill/Tablet/Capsule</option>
                <option value="cream">Cream</option>
                <option value="implant">Implant</option>
                <option value="inhaler">Inhaler</option>
                <option value="suppositories">Suppositories</option>
                <option value="injection">Injection</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div id="dose-suggestions-container" class="dose-suggestions-container" style="display: none;">
            <h3>The following are suggested dosages from Healthie's medication database:</h3>
            <ul id="dose-suggestions-list">
                <!-- Options populated dynamically -->
            </ul>
        </div>

        <div class="form-group-container-2">
            <div id="medication-dose-container" class="form-group">
                <label for="medication-dose">Dosage <span class="required-field">*</span></label>
                <input type="number" id="medication-dose" name="dosage_amount" step="0.1" min="0.1" required>
            </div>
            <div id="medication-dose-unit-container" class="form-group">
                <label for="medication-dose-unit">Unit <span class="required-field">*</span></label>
                <input type="text" id="medication-dose-unit" name="dosage_unit" placeholder="e.g. mg, g, mL, etc." required>
            </div>
        </div>

        <div class="form-group-container-2">
            <div id="medication-dosing-interval-container" class="form-group">
                <label for="medication-dosing-interval">Dosing Interval</label>
                <input type="number" id="medication-dosing-interval" name="dosing_interval" step="1" min="1" placeholder="e.g. 1, 2, 3">
            </div>
            <div id="medication-dosing-schedule-rule-container" class="form-group">
                <label for="medication-dosing-schedule-rule">Dosing Schedule Rule</label>
                <select id="medication-dosing-schedule-rule" name="dosing_schedule_rule">
                    <option value="">-- Select Dosing Schedule Rule --</option>
                    <option value="BID">BID</option>
                    <option value="TID">TID</option>
                    <option value="QID">QID</option>
                    <option value="PRN">PRN</option>
                </select>
            </div>
        </div>

        <div class="form-group-container-2">
            <div id="medication-count-container" class="form-group">
                <label for="medication-count">Count (# of doses per intake)</label>
                <input type="number" id="medication-count" name="dose_count" step="0.5" min="0.5" placeholder="e.g. 0.5, 1, 2">
            </div>
            <div id="medication-frequency-container" class="form-group">
                <label for="medication-frequency">Frequency</label>
                <select id="medication-frequency" name="frequency">
                    <option value="">-- Select Frequency --</option>
                    <option value="hourly">Hourly</option>
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                    <option value="monthly">Monthly</option>
                    <option value="one-time">One-time</option>
                    <option value="as-needed">As Needed</option>
                </select>
            </div>
        </div>

        <div class="form-group-container-2">
            <div id="medication-time-of-day-container" class="form-group">
                <label for="medication-time-of-day">Time of Day</label>
                <select id="medication-time-of-day" name="time_of_day">
                    <option value="">-- Select Time of Day --</option>
                    <option value="morning">Morning</option>
                    <option value="noon">Noon</option>
                    <option value="afternoon">Afternoon</option>
                    <option value="evening">Evening</option>
                    <option value="night">Night</option>
                    <option value="bedtime">Bedtime</option>
                </select>
            </div>
            <div id="medication-time-of-day-specific-container" class="form-group">
                <label for="medication-time-of-day-specific">Time of Day Specific</label>
                <input type="time" id="medication-time-of-day-specific" name="time_of_day_specific">
            </div>
        </div>

        <div id="medication-comment-container" class="form-group">
            <label for="medication-comment">Comment</label>
            <textarea id="medication-comment" name="comment" placeholder="Enter any additional information about the medication"></textarea>
        </div>

        <div id="medication-directions-container" class="form-group">
            <label for="medication-directions">Directions</label>
            <textarea id="medication-directions" name="directions" placeholder="Enter any additional directions about the medication"></textarea>
        </div>
    </div>

    <div class="form-submit-footer">
        <h3 id="form-status-message"></h3>
        <button type="submit" id="medication-submit-btn" class="form-submit-btn" onclick="event.preventDefault(); submitMedicationForm()">Submit</button>
    </div>
</form>
{% endblock %}


{% block scripts %}
<script>

    document.getElementById('medication-is-active-no').addEventListener('input', function() {
        document.getElementById('medication-end-date').disabled = false;
    });
    document.getElementById('medication-is-active-yes').addEventListener('input', function() {
        document.getElementById('medication-end-date').disabled = true;
    });

    document.getElementById('medication-name').addEventListener('input', function() {
        document.getElementById('dose-suggestions-container').style.display = 'block';
    });

</script>
{% endblock %}
