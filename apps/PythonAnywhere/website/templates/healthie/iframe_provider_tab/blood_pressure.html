<!-- Scripts -->
<script>
    document.getElementById("bp-download").addEventListener("click", function() {
        let downloadIcon = document.getElementById("download-icon");

        // Save original classes
        let originalClasses = downloadIcon.className;

        // Change to a loading spinner
        downloadIcon.className = "fas fa-spinner fa-spin";

        // Simulate a file download delay (e.g., 2 seconds)
        setTimeout(() => {
            downloadIcon.className = originalClasses; // Restore original icon
        }, 2000);

    });

</script>
