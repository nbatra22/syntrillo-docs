<style>
    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }

    .spinner {
        display: inline-block;
        width: 2rem !important;
        /* Adjust size as needed */
        height: 2rem !important;
        border: 4px solid white;
        /* Light blue */
        border-top-color: #3b82f6;
        /* Solid blue for animation */
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    /* Spinner containers should not take up space when empty */
    #pd-hr-spinner-container,
    #pd-biometrics-spinner-container {
        display: none;
        margin: 0;
        padding: 0;
        height: 0;
        overflow: hidden;
    }

    #pd-hr-spinner-container:not(:empty),
    #pd-biometrics-spinner-container:not(:empty) {
        height: auto;
        padding: 1rem;
        margin-bottom: 1rem;
    }

    .pd-biometrics-table {
        /* display: none; */
        display: block;
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 1rem;
        background-color: white;
        /* border-radius: 0.375rem; */
        overflow: hidden;
        /* border: 1px solid black; */
        /* box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06); */
    }

    .pd-biometrics-table tr {
        border-bottom: 1px solid black;
        width: 100%;
    }

    /* .pd-biometrics-table tr:last-child {
        border-bottom: none;
    } */

    .pd-biometrics-table td {
        padding: 1rem;
        text-align: left;
        vertical-align: top;
        border: 1px solid black;
    }

    .pd-biometrics-table td:first-child {
        font-weight: bold;
        color: #374151;
        width: 40%;
        background-color: #f9fafb;
        border-right: 1px solid black;
    }

    /* Special styling for heart rate table with multiple columns */
    .pd-biometrics-table td:nth-child(2),
    .pd-biometrics-table td:nth-child(3),
    .pd-biometrics-table td:nth-child(4) {
        width: 20%;
        /* font-weight: bold; */
        color: #374151;
        /* color: #6b7280; */
        text-align: center;
    }

    .pd-biometrics-table th {
        font-weight: bold;
        color: #374151;
        background-color: #f9fafb;
        border-right: 1px solid black;
    }

    .pd-biometrics-table h3 {
        margin: 0 0 0.5rem 0;
        font-size: 1rem;
        font-weight: 500;
        color: #16284a;
    }

    .pd-biometrics-table h4 {
        margin: 0 0 0.5rem 0;
        font-size: 0.875rem;
        font-weight: 500;
        color: #6b7280;
    }

    .pd-biometrics-table ul {
        margin: 0;
        padding-left: 1rem;
        list-style-type: disc;
    }

    .pd-biometrics-table li {
        font-size: 1rem;
        margin-bottom: 0.25rem;
        color: #16284a;
    }
</style>


<div id="" class="" style="width: 100%;">
    <div id="pd-biometrics-spinner-container"></div>
    <div id="pd-biometrics-error-container" class="pd-error-container">
        <!-- <i class="fa-solid fa-circle-exclamation"></i> -->
        <h2 class="pd-no-data-error"></h2>
    </div>
    <table id="pd-biometrics-table" class="pd-biometrics-table">
        <thead>
            <tr>
                <td></td>
                <td>Baseline</td>
                <td>Prior</td>
                <td>Latest</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><strong>Avg. Resting Heart Rate (bpm)</strong></td>
                <td id="pd-biometric-rhr-baseline"></td>
                <td id="pd-biometric-rhr-prior"></td>
                <td id="pd-biometric-rhr-current"></td>
            </tr>
            <tr>
                <td><strong>Body mass index (kg/m²)</strong></td>
                <td id="pd-biometric-bmi-baseline"></td>
                <td id="pd-biometric-bmi-prior"></td>
                <td id="pd-biometric-bmi-current"></td>
            </tr>
            <tr>
                <td><strong>Physical Activity (min/week)</strong></td>
                <td id="pd-biometric-activity-baseline"></td>
                <td id="pd-biometric-activity-prior"></td>
                <td id="pd-biometric-activity-current"></td>
            </tr>
            <tr>
                <td><strong>Physical Inactivity (hours/day)</strong></td>
                <td id="pd-biometric-inactivity-baseline"></td>
                <td id="pd-biometric-inactivity-prior"></td>
                <td id="pd-biometric-inactivity-current"></td>
            </tr>
            <tr>
                <td><strong>Sodium consumer status</strong></td>
                <td id="pd-biometric-sodium-baseline"></td>
                <td id="pd-biometric-sodium-prior"></td>
                <td id="pd-biometric-sodium-current"></td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    function getHRData() {
        // Set up request (aka the form) to send to data fetching routes
        let formData = new FormData()
        formData.append('healthie_provider_id', "{{ healthie_provider_id }}")
        formData.append('healthie_user_id', "{{ healthie_user_id }}")
        formData.append('temporary_lookup_code', "{{ temporary_lookup_code }}")
        formData.append('patient_not_registered_at_syntrillo', "{{ patient_not_registered_at_syntrillo }}")

        // Biometrics table RHR cells
        const biometricRhrBaseline = document.getElementById("pd-biometric-rhr-baseline");
        const biometricRhrPrior = document.getElementById("pd-biometric-rhr-prior");
        const biometricRhrCurrent = document.getElementById("pd-biometric-rhr-current");

        // Hide HR table and show spinner initially until data is successfully fetched
        fetch("{{ url_for('iframe_healthie_patient_sidebar_data_bp.healthie_iframe_patient_sidebar_heart_rate') }}", {
            method: "POST",
            body: formData
        })
            .then(response => response.json())
            .then(data => {
                // console.log("HR Data:", data);

                // Format dates for display
                const formatDate = (dateString) => {
                    if (!dateString) return '-';
                    const date = new Date(dateString);
                    return date.toLocaleDateString('en-US', {
                        month: 'numeric',
                        day: 'numeric',
                        year: 'numeric'
                    });
                };

                // Populate average RHR values in biometrics table
                if (biometricRhrBaseline && data.average_rhr_baseline) {
                    const date = data.baseline_start_date && data.baseline_end_date
                        ? `${formatDate(data.baseline_start_date)} - ${formatDate(data.baseline_end_date)}`
                        : '';
                    biometricRhrBaseline.innerHTML = `${date.length ? `<h4>From ${date}:</h4>` : ''}<div style="font-size: 16px;">${data.average_rhr_baseline.toFixed(1)}</div>`;
                } else if (biometricRhrBaseline) {
                    biometricRhrBaseline.textContent = '-';
                }

                if (biometricRhrPrior && data.average_rhr_prior) {
                    const date = data.prior_start_date && data.prior_end_date
                        ? `${formatDate(data.prior_start_date)} - ${formatDate(data.prior_end_date)}`
                        : '';
                    biometricRhrPrior.innerHTML = `${date.length ? `<h4>From ${date}:</h4>` : ''}<div style="font-size: 16px;">${data.average_rhr_prior.toFixed(1)}</div>`;
                } else if (biometricRhrPrior) {
                    biometricRhrPrior.textContent = '-';
                }

                if (biometricRhrCurrent && data.average_rhr_trailing) {
                    const date = data.current_start_date && data.current_end_date
                        ? `${formatDate(data.current_start_date)} - ${formatDate(data.current_end_date)}`
                        : '';
                    biometricRhrCurrent.innerHTML = `${date.length ? `<h4>From ${date}:</h4>` : ''}<div style="font-size: 16px;">${data.average_rhr_trailing.toFixed(1)}</div>`;
                } else if (biometricRhrCurrent) {
                    biometricRhrCurrent.textContent = '-';
                }

                // Show table and hide spinner
                hideSpinner(hrSpinnerContainer);
                hrSpinnerContainer.style.display = "none";
                hrErrorContainer.style.display = "none";
                hrContent.style.display = "table";
            })
            .catch(e => {
                // console.log("Error fetching HR data for patient:", e);

                // Show table and hide spinners on error
                hideSpinner(hrSpinnerContainer);
                hrErrorContainer.querySelector(".pd-hr-error").textContent = "Error fetching HR data for patient: " + e;
                hrErrorContainer.style.display = "flex";
            })
            .finally(() => {
                hideSpinner(hrSpinnerContainer);
            })

    }

    function getBiometricsData() {
        let formData = new FormData()

        formData.append('healthie_provider_id', "{{ healthie_provider_id }}")
        formData.append('healthie_user_id', "{{ healthie_user_id }}")
        formData.append('temporary_lookup_code', "{{ temporary_lookup_code }}")
        formData.append('patient_not_registered_at_syntrillo', "{{ patient_not_registered_at_syntrillo }}")

        const metricsSpinnerContainer = document.getElementById("pd-biometrics-spinner-container");
        const metricsErrorContainer = document.getElementById("pd-biometrics-error-container");
        const metricsTable = document.getElementById("pd-biometrics-table");

        // BMI content
        const bmiBaseline = document.getElementById("pd-biometric-bmi-baseline");
        const bmiPrior = document.getElementById("pd-biometric-bmi-prior");
        const bmiCurrent = document.getElementById("pd-biometric-bmi-current");
        // Activity content
        const activityBaseline = document.getElementById("pd-biometric-activity-baseline");
        const activityPrior = document.getElementById("pd-biometric-activity-prior");
        const activityCurrent = document.getElementById("pd-biometric-activity-current");
        // Inactivity content
        const inactivityBaseline = document.getElementById("pd-biometric-inactivity-baseline");
        const inactivityPrior = document.getElementById("pd-biometric-inactivity-prior");
        const inactivityCurrent = document.getElementById("pd-biometric-inactivity-current");
        // Sodium content
        const sodiumBaseline = document.getElementById("pd-biometric-sodium-baseline");
        const sodiumPrior = document.getElementById("pd-biometric-sodium-prior");
        const sodiumCurrent = document.getElementById("pd-biometric-sodium-current");

        // Hide table and show spinner initially
        metricsTable.style.display = "none";
        showSpinner(metricsSpinnerContainer);

        fetch("{{ url_for('iframe_healthie_patient_sidebar_data_bp.healthie_iframe_patient_sidebar_biometrics') }}", {
            method: "POST",
            body: formData
        })
            .then(response => response.json())
            .then(data => {
                // console.log("Biometrics Data:", data);

                // Format dates for display
                const formatDate = (dateString) => {
                    if (!dateString) return '-';
                    const date = new Date(dateString);
                    return date.toLocaleDateString('en-US', {
                        month: 'numeric',
                        day: 'numeric',
                        year: 'numeric'
                    });
                };

                // Populate BMI data
                if (bmiBaseline && data.bmi_data?.bmi_baseline) {
                    const date = data.bmi_data?.bmi_baseline.date ? formatDate(data.bmi_data.bmi_baseline.date) : '';
                    const bmi = data.bmi_data?.bmi_baseline.bmi
                    if (bmi) {
                        bmiBaseline.innerHTML = `<h4>As of ${date}:</h4><div style="font-size: 16px;">${bmi.toFixed(1)}</div>`;
                    } else {
                        bmiBaseline.textContent = '-';
                    }
                } else {
                    bmiBaseline.textContent = '-';
                }

                if (bmiPrior && data.bmi_data?.bmi_prior) {
                    const date = data.bmi_data?.bmi_prior.date ? formatDate(data.bmi_data.bmi_prior.date) : '';
                    const bmi = data.bmi_data?.bmi_prior.bmi
                    if (bmi) {
                        bmiPrior.innerHTML = `<h4>As of ${date}:</h4><div style="font-size: 16px;">${bmi.toFixed(1)}</div>`;
                    } else {
                        bmiPrior.textContent = '-';
                    }
                } else {
                    bmiPrior.textContent = '-';
                }

                if (bmiCurrent && data.bmi_data?.bmi_current) {
                    const date = data.bmi_data?.bmi_current.date ? formatDate(data.bmi_data.bmi_current.date) : '';
                    const bmi = data.bmi_data?.bmi_current.bmi
                    if (bmi) {
                        bmiCurrent.innerHTML = `<h4>As of ${date}:</h4><div style="font-size: 16px;">${bmi.toFixed(1)}</div>`;
                    } else {
                        bmiCurrent.textContent = '-';
                    }
                } else {
                    bmiCurrent.textContent = '-';
                }

                // Populate Physical Activity data
                if (activityBaseline) {
                    const activityData = data.physical_activity_data?.active?.activity_baseline;
                    if (activityData && activityData[0]) {
                        const date = activityData[1] ? formatDate(activityData[1]) : '';
                        activityBaseline.innerHTML = `<h4>As of ${date}:</h4><div style="font-size: 16px;">${activityData[0]}</div>`;
                    } else {
                        activityBaseline.textContent = '-';
                    }
                }

                if (activityPrior) {
                    const activityData = data.physical_activity_data?.active?.activity_prior;
                    if (activityData && activityData[0]) {
                        const date = activityData[1] ? formatDate(activityData[1]) : '';
                        activityPrior.innerHTML = `<h4>As of ${date}:</h4><div style="font-size: 16px;">${activityData[0]}</div>`;
                    } else {
                        activityPrior.textContent = '-';
                    }
                }

                if (activityCurrent) {
                    const activityData = data.physical_activity_data?.active?.activity_current;
                    if (activityData && activityData[0]) {
                        const date = activityData[1] ? formatDate(activityData[1]) : '';
                        activityCurrent.innerHTML = `<h4>As of ${date}:</h4><div style="font-size: 16px;">${activityData[0]}</div>`;
                    } else {
                        activityCurrent.textContent = '-';
                    }
                }

                // Populate Physical Inactivity data
                if (inactivityBaseline) {
                    const inactivityData = data.physical_activity_data?.inactive?.inactivity_baseline;
                    if (inactivityData && inactivityData[0]) {
                        const date = inactivityData[1] ? formatDate(inactivityData[1]) : '';
                        inactivityBaseline.innerHTML = `<h4>As of ${date}:</h4><div style="font-size: 16px;">${inactivityData[0]}</div>`;
                    } else {
                        inactivityBaseline.textContent = '-';
                    }
                }

                if (inactivityPrior) {
                    const inactivityData = data.physical_activity_data?.inactive?.inactivity_prior;
                    if (inactivityData && inactivityData[0]) {
                        const date = inactivityData[1] ? formatDate(inactivityData[1]) : '';
                        inactivityPrior.innerHTML = `<h4>As of ${date}:</h4><div style="font-size: 16px;">${inactivityData[0]}</div>`;
                    } else {
                        inactivityPrior.textContent = '-';
                    }
                }

                if (inactivityCurrent) {
                    const inactivityData = data.physical_activity_data?.inactive?.inactivity_current;
                    if (inactivityData && inactivityData[0]) {
                        const date = inactivityData[1] ? formatDate(inactivityData[1]) : '';
                        inactivityCurrent.innerHTML = `<h4>As of ${date}:</h4><div style="font-size: 16px;">${inactivityData[0]}</div>`;
                    } else {
                        inactivityCurrent.textContent = '-';
                    }
                }

                // Populate Sodium/Sodium Status Questionnaire data
                if (sodiumBaseline) {
                    const ssqData = data.ssq_data?.ssq_baseline;
                    if (ssqData !== null && ssqData !== undefined) {
                        const date = data.ssq_data?.ssq_baseline_date ? formatDate(data.ssq_data.ssq_baseline_date) : '';
                        sodiumBaseline.innerHTML = `<h4>As of ${date}:</h4><div style="font-size: 16px;">${ssqData.toFixed(1)}</div>`;
                    } else {
                        sodiumBaseline.textContent = '-';
                    }
                }

                if (sodiumPrior) {
                    const ssqData = data.ssq_data?.ssq_prior;
                    if (ssqData !== null && ssqData !== undefined) {
                        const date = data.ssq_data?.ssq_prior_date ? formatDate(data.ssq_data.ssq_prior_date) : '';
                        sodiumPrior.innerHTML = `<h4>As of ${date}:</h4><div style="font-size: 16px;">${ssqData.toFixed(1)}</div>`;
                    } else {
                        sodiumPrior.textContent = '-';
                    }
                }

                if (sodiumCurrent) {
                    const ssqData = data.ssq_data?.ssq_current;
                    if (ssqData !== null && ssqData !== undefined) {
                        const date = data.ssq_data?.ssq_current_date ? formatDate(data.ssq_data.ssq_current_date) : '';
                        sodiumCurrent.innerHTML = `<h4>As of ${date}:</h4><div style="font-size: 16px;">${ssqData.toFixed(1)}</div>`;
                    } else {
                        sodiumCurrent.textContent = '-';
                    }
                }

                // Show table and hide spinner
                hideSpinner(metricsSpinnerContainer);
                metricsErrorContainer.style.display = 'none';
                metricsTable.style.display = "table";
            })
            .catch(error => {
                // console.log("Error fetching biometrics data for patient:", error);

                // Show error container and hide spinner
                hideSpinner(metricsSpinnerContainer);
                metricsErrorContainer.querySelector(".pd-no-data-error").textContent = "Error fetching biometrics data for patient: " + error;
                metricsErrorContainer.style.display = "flex";
            })
            .finally(() => {
                hideSpinner(metricsSpinnerContainer);
            })
    }

    getHRData();
    getBiometricsData();

</script>
