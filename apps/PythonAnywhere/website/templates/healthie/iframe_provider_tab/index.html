<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthie Extra Provider Tab - Syntrillo server</title>
    <link rel="icon" href="{{ url_prefix + url_for('static', filename='favicon.ico') }}" type="image/x-icon">

    <!-- Link to Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- Include jQuery UI for Tooltip -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">

    <!-- Include font-awesome for collapsable icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- Link to local CSS - at last position -->
    <link rel="stylesheet" href="{{ url_prefix + url_for('static', filename='healthie/iframe_provider.css') }}">

    <style>
        /* space before system tab */
        .nav-tabs .nav-item.ml-auto {
            margin-left: auto;
        }
    </style>
</head>
<body>

<div class="container"> <!-- mt-1 -->
    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item">
            <a class="nav-link active" id="tab-status-tab" data-toggle="tab" href="#tab-status" role="tab" aria-controls="tab-status" aria-selected="true">Status</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="tab-devices-tab" data-toggle="tab" href="#tab-devices" role="tab" aria-controls="tab-devices" aria-selected="false">Devices</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="tab-onboarding-tab" data-toggle="tab" href="#tab-onboarding" role="tab" aria-controls="tab-onboarding" aria-selected="false">Onboarding</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="tab-care-plan-tab" data-toggle="tab" href="#tab-care-plan" role="tab" aria-controls="tab-care-plan" aria-selected="false">Care Plan</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="tab-cdss-tab" data-toggle="tab" href="#tab-cdss" role="tab" aria-controls="tab-cdss" aria-selected="false">CDSS</a>
        </li>
        <!-- Large gap -->
        <li class="nav-item ml-auto">
            <a class="nav-link" id="tab-system-tab" data-toggle="tab" href="#tab-system" role="tab" aria-controls="tab-system" aria-selected="false">System</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="tab-system-devices-tab" data-toggle="tab" href="#tab-system-devices" role="tab" aria-controls="tab-system-devices" aria-selected="false">System Devices</a>
        </li>
    </ul>
    <div class="tab-content" id="myTabContent">
        <div class="tab-pane fade show active" id="tab-status" role="tabpanel" aria-labelledby="tab-status-tab"></div>
        <div class="tab-pane fade" id="tab-devices" role="tabpanel" aria-labelledby="tab-devices-tab"></div>
        <div class="tab-pane fade" id="tab-onboarding" role="tabpanel" aria-labelledby="tab-onboarding-tab"></div>
        <div class="tab-pane fade" id="tab-care-plan" role="tabpanel" aria-labelledby="tab-care-plan-tab"></div>
        <div class="tab-pane fade" id="tab-cdss" role="tabpanel" aria-labelledby="tab-cdss-tab"></div>
        <div class="tab-pane fade" id="tab-system" role="tabpanel" aria-labelledby="tab-system-tab"></div>
        <div class="tab-pane fade" id="tab-system-devices" role="tabpanel" aria-labelledby="tab-system-devices-tab"></div>
    </div>
</div>

<!-- a spacer at the bottom. Nicer when the user scrolls up -->
<div class="bg-white mb-5">
    <p>&nbsp;</p>
</div>

<!-- =================== SCRIPTS =================== -->

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<!-- Include jQuery UI for Tooltip -->
<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>

<script>

    // Global function to format ISO date to US date format (MMM DD, YYYY)
    function formatDate(isoDate) {
        var date = new Date(isoDate);
        var options = { year: 'numeric', month: 'short', day: 'numeric' };
        return date.toLocaleDateString('en-US', options);
    }

    // Function to load content via POST
    //   : POST prefered over GET to avoid caching sensitive data in the URL
    function loadTabContent(url, target, milliseconds_delay=2000) {

        $(target).html("<h3>Loading content. Please wait...</h3>");

        // Variables passed from Flask
        var healthieProviderId = "{{ healthie_provider_id }}";
        var healthieUserId = "{{ healthie_user_id }}";
        var temporaryLookupCode = "{{ temporary_lookup_code }}";
        var PatientNotRegisteredAtSyntrillo = "{{ patient_not_registered_at_syntrillo }}";

        setTimeout(function() {
            $.ajax({
                type: 'POST',
                url: url,
                data: {
                    healthie_provider_id: healthieProviderId,
                    healthie_user_id: healthieUserId,
                    temporary_lookup_code: temporaryLookupCode,
                    patient_not_registered_at_syntrillo: PatientNotRegisteredAtSyntrillo
                },
                success: function(data) {
                    $(target).html(data);
                },
                error: function(jqXHR, textStatus, errorThrown) {
                    $(target).html('<p>Error: ' + jqXHR.status + ' ' + errorThrown + '</p>');
                }
            });
        }, milliseconds_delay); // some delay needed to prevent a server error on VSCode Live Server
    }

    $(document).ready(function(){

        // Delegate the click event to the parent container for collapsible sections
        $(document).on('click', '.collapsible', function() {
            var icon = $(this).find("i");
            icon.toggleClass("fa-chevron-right fa-chevron-down");
            $(this).next(".collapsible-content").toggleClass("show");
        });


        // Load the content of the status tab immediately
        loadTabContent('{{ url_prefix + url_for("iframe_healthie_provider_tab_status_bp.iframe_healthie_provider_tab_status") }}', '#tab-status', 500);

        // Load the content of the other tabs in the background
        loadTabContent('{{ url_prefix + url_for("iframe_healthie_provider_tab_devices_bp.iframe_healthie_provider_tab_devices") }}', '#tab-devices');
        loadTabContent('{{ url_prefix + url_for("iframe_healthie_provider_tab_onboarding_bp.iframe_healthie_provider_tab_onboarding") }}', '#tab-onboarding');
        loadTabContent('{{ url_prefix + url_for("iframe_healthie_provider_tab_care_plan_bp.iframe_healthie_provider_tab_care_plan") }}', '#tab-care-plan');
        loadTabContent('{{ url_prefix + url_for("iframe_healthie_provider_tab_cdss_bp.iframe_healthie_provider_tab_cdss") }}', '#tab-cdss');
        loadTabContent('{{ url_prefix + url_for("iframe_healthie_provider_tab_system_bp.iframe_healthie_provider_tab_system") }}', '#tab-system');
        loadTabContent('{{ url_prefix + url_for("iframe_healthie_provider_tab_system_devices_bp.iframe_healthie_provider_tab_system_devices") }}', '#tab-system-devices');

    });


</script>

</body>
</html>
